<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Jogos de Videogame</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 20px 100px; }
    h1 { text-align: center; }
    .card { border: 1px solid #333; padding: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .indisponivel { background: orange; color: white; padding: 2px 6px; margin-left: 8px; font-size: 0.8em; }
    .btn-alterar { background: #5b9bd5; color: white; border: none; padding: 6px 12px; cursor: pointer; display: block; margin-bottom: 6px; }
    .btn-excluir { background: #c00000; color: white; border: none; padding: 6px 12px; cursor: pointer; }
    .campo { margin-bottom: 12px; }
    label { display: block; font-weight: bold; }
    input[type=text], input[type=number], textarea { width: 100%; padding: 6px; box-sizing: border-box; }
    .erro { color: red; font-size: 0.85em; margin: 2px 0 0; }
    #mensagem { padding: 8px; display: none; }
    #mensagem.sucesso { display: block; background: #d4edda; color: #155724; }
    #mensagem.falha { display: block; background: #f8d7da; color: #721c24; }
    footer { position: fixed; bottom: 0; left: 0; right: 0; background: gray; color: white; text-align: center; padding: 8px; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Gerenciador de Jogos de Videogame</h1>
  <p id="mensagem"></p>

  <section id="telaLista">
    <div id="lista"></div>
    <button onclick="abrirFormNovo()">Incluir novo jogo</button>
  </section>

  <section id="telaForm" style="display:none">
    <h2 id="tituloForm"></h2>
    <form id="formJogo" novalidate>
      <div class="campo">
        <label for="titulo">Título</label>
        <input type="text" id="titulo">
        <p class="erro" id="erro-titulo"></p>
      </div>
      <div class="campo">
        <label for="ano">Ano de lançamento</label>
        <input type="number" id="ano">
        <p class="erro" id="erro-ano"></p>
      </div>
      <div class="campo">
        <label for="plataforma">Plataforma</label>
        <input type="text" id="plataforma">
        <p class="erro" id="erro-plataforma"></p>
      </div>
      <div class="campo">
        <label>Disponível</label>
        <label><input type="radio" name="disponivel" id="dispSim" checked> Sim</label>
        <label><input type="radio" name="disponivel" id="dispNao"> Não</label>
        <p class="erro" id="erro-disponivel"></p>
      </div>
      <div class="campo">
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" rows="4"></textarea>
        <p class="erro" id="erro-observacoes"></p>
      </div>
      <button type="submit">Salvar</button>
      <button type="button" onclick="mostrarTelaLista()">Cancelar</button>
    </form>
  </section>

  <footer>
    Estella Garcia Silva / Nicolle Lima Feitosa / Turma 3B Noturno / 2026<br>
    Usou IA?: Sim, utilizamos o uso da inteligência artificial Claude como ferramente de apoio,
     principalmente no index.html, compreensão do código e depuração.
  </footer>

  <script>
    // Guarda o id do jogo que está sendo alterado (null quando estiver incluindo um novo)
    let idEmEdicao = null;

    // Mostra uma mensagem verde (sucesso) ou vermelha (erro) no topo da página
    function mostrarMensagem(texto, ehErro) {
      const el = document.getElementById('mensagem');
      el.textContent = texto;
      if (ehErro) {
        el.className = 'falha';
      } else {
        el.className = 'sucesso';
      }
    }

    // Esconde a mensagem do topo
    function limparMensagem() {
      const el = document.getElementById('mensagem');
      el.textContent = '';
      el.className = '';
    }

    // Apaga os textos de erro embaixo de cada campo
    function limparErros() {
      document.getElementById('erro-titulo').textContent = '';
      document.getElementById('erro-ano').textContent = '';
      document.getElementById('erro-plataforma').textContent = '';
      document.getElementById('erro-disponivel').textContent = '';
      document.getElementById('erro-observacoes').textContent = '';
    }

    // Mostra embaixo de cada campo o erro que o Spring Boot enviou (formato: { "titulo": "mensagem", ... })
    function exibirErros(erros) {
      document.getElementById('erro-titulo').textContent = erros.titulo || '';
      document.getElementById('erro-ano').textContent = erros.ano || '';
      document.getElementById('erro-plataforma').textContent = erros.plataforma || '';
      document.getElementById('erro-disponivel').textContent = erros.disponivel || '';
      document.getElementById('erro-observacoes').textContent = erros.observacoes || '';
    }

    // Mostra a tela com a lista de jogos e atualiza a lista
    function mostrarTelaLista() {
      document.getElementById('telaForm').style.display = 'none';
      document.getElementById('telaLista').style.display = 'block';
      carregarLista();
    }

    // Mostra a tela com o formulário (usada para incluir e para alterar)
    function mostrarTelaForm() {
      document.getElementById('telaLista').style.display = 'none';
      document.getElementById('telaForm').style.display = 'block';
    }

    // Busca os jogos no backend (GET /jogos) e desenha um card para cada um
    async function carregarLista() {
      try {
        const resp = await fetch('/jogos');
        if (!resp.ok) {
          throw new Error('HTTP ' + resp.status);
        }
        const jogos = await resp.json();
        const lista = document.getElementById('lista');
        lista.innerHTML = '';
        for (const j of jogos) {
          let aviso = '';
          if (!j.disponivel) {
            aviso = '<span class="indisponivel">INDISPONÍVEL</span>';
          }
          lista.insertAdjacentHTML('beforeend', `
            <div class="card">
              <div>
                <strong>${j.titulo}</strong> ${aviso}<br>
                <strong>Ano de lançamento: ${j.ano}</strong><br>
                <strong>Plataforma: ${j.plataforma}</strong>
              </div>
              <div>
                <button class="btn-alterar" onclick="abrirFormAlterar(${j.id})">Alterar</button>
                <button class="btn-excluir" onclick="excluirJogo(${j.id})">Excluir</button>
              </div>
            </div>`);
        }
      } catch (err) {
        mostrarMensagem('Erro ao carregar a lista: ' + err.message, true);
      }
    }

    // Abre o formulário vazio para incluir um novo jogo
    function abrirFormNovo() {
      limparMensagem();
      limparErros();
      idEmEdicao = null;
      document.getElementById('titulo').value = '';
      document.getElementById('ano').value = '';
      document.getElementById('plataforma').value = '';
      document.getElementById('dispSim').checked = true;
      document.getElementById('observacoes').value = '';
      document.getElementById('tituloForm').textContent = 'Incluir novo jogo';
      mostrarTelaForm();
    }

    // Busca o jogo no backend (GET /jogos/{id}) e abre o formulário com os dados preenchidos
    async function abrirFormAlterar(id) {
      limparMensagem();
      limparErros();
      const resp = await fetch('/jogos/' + id);
      if (!resp.ok) {
        mostrarMensagem('Não foi possível carregar o jogo.', true);
        return;
      }
      const j = await resp.json();
      idEmEdicao = id;
      document.getElementById('titulo').value = j.titulo;
      document.getElementById('ano').value = j.ano;
      document.getElementById('plataforma').value = j.plataforma;
      document.getElementById('observacoes').value = j.observacoes ?? '';
      if (j.disponivel) {
        document.getElementById('dispSim').checked = true;
      } else {
        document.getElementById('dispNao').checked = true;
      }
      document.getElementById('tituloForm').textContent = 'Alterar jogo - ID ' + id;
      mostrarTelaForm();
    }

    // Envia o formulário: POST /jogos (novo) ou PUT /jogos/{id} (alteração)
    async function salvarJogo(evt) {
      evt.preventDefault();
      limparErros();
      limparMensagem();

      // Se o ano estiver vazio, envia null para o Spring Boot avisar que é obrigatório
      let ano = document.getElementById('ano').value;
      if (ano === '') {
        ano = null;
      } else {
        ano = Number(ano);
      }

      const dados = {
        titulo: document.getElementById('titulo').value,
        ano: ano,
        plataforma: document.getElementById('plataforma').value,
        disponivel: document.getElementById('dispSim').checked,
        observacoes: document.getElementById('observacoes').value
      };

      let url = '/jogos';
      let metodo = 'POST';
      if (idEmEdicao !== null) {
        url = '/jogos/' + idEmEdicao;
        metodo = 'PUT';
      }

      try {
        const resp = await fetch(url, {
          method: metodo,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        if (resp.ok) {
          mostrarTelaLista();
          mostrarMensagem('Jogo salvo com sucesso!', false);
        } else if (resp.status === 400) {
          const erros = await resp.json();
          exibirErros(erros);
          mostrarMensagem('Corrija os erros indicados no formulário.', true);
        } else {
          mostrarMensagem('Erro ao salvar: HTTP ' + resp.status, true);
        }
      } catch (err) {
        mostrarMensagem('Não foi possível conectar ao servidor.', true);
      }
    }

    // Pede confirmação e, se o usuário clicar em OK, exclui o jogo (DELETE /jogos/{id})
    async function excluirJogo(id) {
      const confirmado = window.confirm('Deseja excluir o jogo ID ' + id + '?');
      if (!confirmado) {
        return;
      }
      const resp = await fetch('/jogos/' + id, { method: 'DELETE' });
      if (resp.ok) {
        await carregarLista();
        mostrarMensagem('Jogo excluído com sucesso!', false);
      } else {
        mostrarMensagem('Erro ao excluir: HTTP ' + resp.status, true);
      }
    }

    // Liga o botão Salvar do formulário à função salvarJogo
    document.getElementById('formJogo').addEventListener('submit', salvarJogo);

    // Ao abrir a página, carrega a lista de jogos
    carregarLista();
  </script>
</body>
</html>
